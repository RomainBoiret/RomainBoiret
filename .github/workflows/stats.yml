name: Update README stats cards

on:
  schedule:
    - cron: "0 0 * * *"   # une fois par jour
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=RomainBoiret&show_icons=true&hide_border=true&bg_color=0e1018&title_color=8B8FF7&icon_color=8B8FF7&text_color=c9d1d9"
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: "username=RomainBoiret&layout=compact&hide_border=true&bg_color=0e1018&title_color=8B8FF7&text_color=c9d1d9"
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          git diff --staged --quiet || git commit -m "Update stats cards [skip ci]"
          git push